name: stem-check
on:
  pull_request:
  push:
    branches: [main, 'learning/**']
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Known gap: the Windows cell fails (WSL bash, 8.3 paths, shebang scripts); fixed in TASK-381, until then it may fail
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    defaults:
      run:
        shell: bash  # Git Bash on Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 .github/stem-check.py
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -S warning scripts/*.sh scripts/githooks/* .github/bump-version.sh
