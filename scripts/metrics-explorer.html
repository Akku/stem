<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>STEM metrics explorer</title>
<style>
/* Token plan: 1 accent, 5 categorical series (+ grey "other") that differ in hue and lightness; type roles; 4px spacing scale. */
:root{
 --bg:#fafaf8;--surface:#fff;--text:#1b1d22;--muted:#565c6b;--line:#dcdfe5;--line-strong:#848a96;
 --accent:#2a56c0;--accent-weak:#e9eefa;
 --s1:#1f3c88;--s2:#5d8ee8;--s3:#b35f0c;--s4:#7d4cb8;--s5:#1d7f72;--s0:#7f8693;
 --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
 --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
 --t-xs:.75rem;--t-sm:.8125rem;--t-md:.9375rem;--t-lg:1.125rem;--t-xl:1.5rem;
 --sp1:4px;--sp2:8px;--sp3:12px;--sp4:16px;--sp5:24px;--sp6:40px;--sp7:64px;
 color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{
 --bg:#131519;--surface:#1a1d22;--text:#e6e8ec;--muted:#a3a9b6;--line:#2e323a;--line-strong:#6c7380;
 --accent:#8aaaff;--accent-weak:#232b40;
 --s1:#b3c8ff;--s2:#5b88ec;--s3:#f0a252;--s4:#b892f2;--s5:#3fbfad;--s0:#8b919d;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{margin:0;background:var(--bg);color:var(--text);font:var(--t-md)/1.5 var(--font)}
.num,td.n,th.n,.kpi b,svg text{font-variant-numeric:tabular-nums}
h1{font-size:var(--t-lg);margin:0;font-weight:650}
h2{font-size:var(--t-xl);font-weight:600;margin:0 0 var(--sp1)}
h3{font-size:var(--t-lg);font-weight:600;margin:0 0 var(--sp1)}
p{margin:0}
.note{color:var(--muted);font-size:var(--t-sm);max-width:75ch}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.btn,select,input[type=date],input[type=search]{min-height:40px;padding:6px 10px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface)}
.btn[aria-pressed=true]{background:var(--accent-weak);border-color:var(--accent);font-weight:600}
.link{white-space:nowrap;background:none;border:0;padding:2px 0;color:var(--accent);text-decoration:underline;text-underline-offset:2px;min-height:28px;text-align:left}
@media (pointer:coarse){.link{min-height:44px}.btn,select,input{min-height:44px}}
/* header / filters */
header.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:1240px;margin:0 auto;padding:var(--sp3) var(--sp4);display:grid;gap:var(--sp2)}
.row1{display:flex;flex-wrap:wrap;gap:var(--sp2) var(--sp4);align-items:center}
#summary{flex:1 1 320px;font-size:var(--t-sm);color:var(--muted)}
#summary strong{color:var(--text);font-weight:600}
#controls{display:flex;flex-wrap:wrap;gap:var(--sp2) var(--sp4);align-items:end}
#controls label,.fld>span{display:block;font-size:var(--t-xs);color:var(--muted);margin-bottom:2px}
.fld{display:flex;flex-direction:column}
.seg{display:flex;gap:var(--sp1)}
#q{width:15rem;max-width:100%}
#ftoggle{display:none}
nav.toc{display:flex;gap:var(--sp4);overflow-x:auto;font-size:var(--t-sm);padding-bottom:2px}
nav.toc a{white-space:nowrap;padding:4px 0}
@media (max-width:760px){
 #ftoggle{display:inline-block}
 header.bar:not(.open) #controls{display:none}
 #controls>*{flex:1 1 140px}#q{width:100%}
 nav.toc{display:none}
}
/* layout */
main{max-width:1240px;margin:0 auto;padding:var(--sp5) var(--sp4) var(--sp7)}
section{margin-top:var(--sp7);scroll-margin-top:170px}
section:first-child{margin-top:var(--sp4)}
.sec-head{margin-bottom:var(--sp5);border-bottom:1px solid var(--line);padding-bottom:var(--sp3)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:var(--sp6) var(--sp6)}
.panel{min-width:0}
.panel>.note{margin-bottom:var(--sp3)}
.chart{width:100%;min-height:40px}
.chart svg{display:block;overflow:visible}
svg text{fill:var(--muted);font-size:11px;font-family:var(--font)}
svg .lbl{fill:var(--text)}
svg .grid{stroke:var(--line);stroke-width:1}
svg .axis{stroke:var(--line-strong);stroke-width:1}
.legend{display:flex;flex-wrap:wrap;gap:var(--sp1) var(--sp4);list-style:none;margin:0 0 var(--sp2);padding:0;font-size:var(--t-sm)}
.legend li{display:flex;align-items:center;gap:6px}
.sw{display:inline-block;width:12px;height:12px;border-radius:2px;flex:none}
.sw.ln{height:3px;border-radius:0}
.sw.ring{border:2px solid currentColor;border-radius:50%;background:none}
details.data{margin-top:var(--sp2);font-size:var(--t-sm)}
details.data summary{cursor:pointer;color:var(--accent);min-height:28px}
.empty{color:var(--muted);font-style:italic;padding:var(--sp3) 0}
/* KPIs: a quiet strip, not a card grid */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));border-top:1px solid var(--line)}
.kpi{padding:var(--sp4) var(--sp4) var(--sp4) 0;border-bottom:1px solid var(--line)}
.kpi>span{display:block;font-size:var(--t-sm);color:var(--muted)}
.kpi b{display:block;font-size:var(--t-xl);font-weight:600;line-height:1.25;margin:2px 0}
.kpi small{display:block;font-size:var(--t-xs);color:var(--muted);line-height:1.45}
.kpi small.cmp{color:var(--text)}
/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.tw.tall{max-height:22rem;overflow-y:auto}
table{border-collapse:collapse;width:100%;font-size:var(--t-sm)}
th,td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;background:var(--surface);position:sticky;top:0;z-index:1;white-space:nowrap}
td.n,th.n{text-align:right}
th.n .sort{justify-content:flex-end}
td.t{min-width:16rem;max-width:34rem}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--accent-weak)}
.sort{all:unset;display:flex;gap:4px;align-items:center;cursor:pointer;width:100%;min-height:28px}
.sort:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sort .ar{font-size:.7em;color:var(--muted);min-width:1em}
.bar-cell{display:flex;align-items:center;gap:8px}
.hb{height:10px;background:var(--s1);border-radius:1px}
.more{margin-top:var(--sp2)}
.mut{color:var(--muted)}
/* stacked evidence bar */
.sbar{display:flex;height:28px;border-radius:3px;overflow:hidden;margin:var(--sp2) 0}
.sbar>div{display:flex;align-items:center;padding:0 8px;font-size:var(--t-sm);white-space:nowrap;color:#fff}
@media (prefers-color-scheme:dark){.sbar>div{color:var(--bg)}}
.panel.wide{grid-column:1/-1}
td.nw{white-space:nowrap}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--sp3) var(--sp5);margin:var(--sp3) 0;font-size:var(--t-sm)}
.facts div span{display:block;color:var(--muted);font-size:var(--t-xs)}
.facts div b{font-weight:600;font-size:var(--t-lg)}
/* details dialog */
dialog{border:0;padding:0;margin:0 0 0 auto;height:100%;max-height:100%;width:min(640px,100%);max-width:100%;background:var(--surface);color:var(--text);border-left:1px solid var(--line-strong)}
dialog::backdrop{background:rgba(10,12,16,.45)}
.dlg-h{position:sticky;top:0;background:var(--surface);display:flex;gap:var(--sp3);align-items:flex-start;padding:var(--sp4);border-bottom:1px solid var(--line)}
.dlg-h h2{font-size:var(--t-lg);flex:1;margin:0}
.dlg-b{padding:var(--sp4) var(--sp4) var(--sp6)}
.dlg-b h3{margin-top:var(--sp5);font-size:var(--t-md)}
dl.kv{display:grid;grid-template-columns:minmax(9rem,auto) 1fr;gap:4px var(--sp4);margin:0;font-size:var(--t-sm)}
dl.kv dt{color:var(--muted)}dl.kv dd{margin:0}
.close{min-width:44px;min-height:44px}
footer{max-width:1240px;margin:0 auto;padding:var(--sp4);font-size:var(--t-xs);color:var(--muted);border-top:1px solid var(--line)}
/* chart hover: highlight the hovered mark(s), dim the rest, one floating tooltip */
svg.hz{touch-action:pan-y}
svg.hz:focus{outline:none}svg.hz:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
svg .band{fill:var(--accent-weak)}
@media (prefers-reduced-motion:no-preference){svg .mk{transition:opacity .12s}}
svg.hov .mk:not(.hl){opacity:.3}
svg .pt.hl{stroke:var(--text);stroke-width:2.5px}
svg line.mk.hl{stroke:var(--text);stroke-width:2px}
.tip{position:fixed;z-index:20;pointer-events:none;max-width:min(300px,calc(100vw - 16px));padding:8px 10px;background:var(--surface);color:var(--text);border:1px solid var(--line-strong);border-radius:6px;box-shadow:0 4px 16px rgba(10,12,16,.18);font-size:var(--t-sm);line-height:1.35}
.tip>b{display:block;font-weight:600}
.tip .tsub{color:var(--muted);font-size:var(--t-xs);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tip table{width:auto;margin-top:6px;font-size:var(--t-sm)}
.tip th,.tip td{padding:1px 0;border:0;background:none;position:static;font-weight:400}
.tip th{padding:1px 12px 1px 0;color:var(--muted);text-align:left}
.tip td:first-child{padding-right:6px;width:12px}
.tip td.n{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.tip tr.ttot th,.tip tr.ttot td{border-top:1px solid var(--line);padding-top:3px;color:var(--text)}
.tip .thint{margin-top:6px;color:var(--muted);font-size:var(--t-xs)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<header class="bar" id="bar">
 <div class="bar-in">
  <div class="row1">
   <h1>Metrics explorer</h1>
   <p id="summary" aria-live="polite"></p>
   <button class="btn" id="ftoggle" aria-expanded="false" aria-controls="controls">Filters</button>
   <button class="btn" id="reset">Reset filters</button>
  </div>
  <div id="controls" role="group" aria-label="Filters (apply to every section)">
   <div class="fld"><span id="plbl">Period</span>
    <div class="seg" role="group" aria-labelledby="plbl">
     <button class="btn" data-preset="7">7d</button><button class="btn" data-preset="30">30d</button><button class="btn" data-preset="all">All</button>
    </div></div>
   <div class="fld"><label for="from">From</label><input type="date" id="from"></div>
   <div class="fld"><label for="to">To (inclusive)</label><input type="date" id="to"></div>
   <div class="fld"><label for="ms">Milestone</label><select id="ms"></select></div>
   <div class="fld"><label for="q">Task (ID or title)</label><input type="search" id="q" placeholder="e.g. TASK-311 or retro" autocomplete="off"></div>
   <div class="fld"><label for="model">Model</label><select id="model"></select></div>
  </div>
  <nav class="toc" aria-label="Sections"><a href="#overview">Overview</a><a href="#cost">Cost &amp; resources</a><a href="#quality">Quality &amp; process</a><a href="#retros">Retros</a><a href="#tasks">Tasks</a><a href="#sessions">Sessions</a></nav>
 </div>
</header>
<main id="main"></main>
<footer id="foot"></footer>
<dialog id="dlg" aria-labelledby="dlg-title"><div class="dlg-h"><h2 id="dlg-title"></h2><button class="btn close" id="dlg-x" aria-label="Close details">Close</button></div><div class="dlg-b" id="dlg-b"></div></dialog>
<script>
const DATA = /*__STEM_DATA__*/null;
(function(){
'use strict';
const $=id=>document.getElementById(id), NA='n/a', DAY=864e5, NS='http'+'://www.w3.org/2000/svg';
const main=$('main');
function add(e,k){for(const c of k.flat(9)){if(c==null||c===false)continue;e.append(c instanceof Node?c:String(c))}return e}
function el(t,a,...k){const e=document.createElement(t);for(const[n,v]of Object.entries(a||{})){if(v==null||v===false)continue;if(n==='text')e.textContent=v;else if(n==='class')e.className=v;else if(n.slice(0,2)==='on')e.addEventListener(n.slice(2),v);else e.setAttribute(n,v===true?'':v)}return add(e,k)}
function S(t,a,txt){const e=document.createElementNS(NS,t);for(const[n,v]of Object.entries(a||{}))if(v!=null)e.setAttribute(n,v);if(txt!=null)e.textContent=txt;return e}
if(!DATA||typeof DATA!=='object'){
 $('controls').hidden=true;$('reset').hidden=true;$('ftoggle').hidden=true;document.querySelector('nav.toc').hidden=true;
 main.append(el('p',{class:'empty',text:'No data: run scripts/metrics-explorer.py to generate this report (it writes a copy of this file with the data embedded).'}));
 return;
}
/* ---------- formatting ---------- */
const nf=new Intl.NumberFormat('en-US');
const ok=v=>v!=null&&!Number.isNaN(v);
const usd=v=>!ok(v)?NA:'$'+(Math.abs(v)<1000?v.toFixed(2):nf.format(Math.round(v)));
const tok=v=>!ok(v)?NA:v>=1e9?(v/1e9).toFixed(2)+'B':v>=1e6?(v/1e6).toFixed(v>=1e8?0:1)+'M':v>=1e3?Math.round(v/1e3)+'k':String(Math.round(v));
const num=v=>!ok(v)?NA:nf.format(Math.round(v*10)/10);
const int=v=>!ok(v)?NA:nf.format(Math.round(v));
const hrs=v=>!ok(v)?NA:v<1?Math.round(v*60)+' min':v<10?v.toFixed(1)+' h':nf.format(Math.round(v))+' h';
const mins=v=>!ok(v)?NA:hrs(v/60);
const pct=v=>!ok(v)?NA:v>0&&v<.005?'<1%':Math.round(v*100)+'%';
const day=ms=>new Date(ms).toISOString().slice(0,10);
const dt=s=>s?String(s).slice(0,16).replace('T',' '):NA;
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const md=ms=>{const d=new Date(ms);return MON[d.getUTCMonth()]+' '+d.getUTCDate()};
const short=m=>String(m).replace(/^claude-/,'');
const tnum=id=>parseInt(String(id).replace(/\D+/g,''),10)||0;
function quant(a,q){if(!a.length)return null;const s=a.slice().sort((x,y)=>x-y),i=(s.length-1)*q,lo=Math.floor(i),hi=Math.ceil(i);return s[lo]+(s[hi]-s[lo])*(i-lo)}
const median=a=>quant(a,.5);
/* ---------- data prep ---------- */
const meta=DATA.meta||{}, MS=DATA.milestones||{};
const gen=Date.parse(meta.generated)||Date.now();
const SS=(DATA.sessions||[]).map(s=>Object.assign({},s,{_t:Date.parse(s.start),tasks:s.tasks||[],models:s.models||{}})).filter(s=>ok(s._t));
const TT=(DATA.tasks||[]).map(t=>Object.assign({},t,{id:String(t.id||''),title:String(t.title||''),_c:t.created?Date.parse(t.created):null,_u:t.updated?Date.parse(t.updated):null}));
const RR=(DATA.retros||[]).map(r=>Object.assign({},r,{_t:r.created?Date.parse(r.created):null}));
const byId=new Map(TT.map(t=>[t.id,t])), sById=new Map(SS.map(s=>[s.id,s]));
const tSess=new Map();for(const s of SS)for(const id of s.tasks){if(!tSess.has(id))tSess.set(id,[]);tSess.get(id).push(s)}
const mTot={};for(const s of SS)for(const[m,v]of Object.entries(s.models)){const o=mTot[m]||(mTot[m]={c:0,t:0});o.c+=v.cost||0;o.t+=v.turns||0}
const MODELS=Object.keys(mTot).sort((a,b)=>mTot[b].c-mTot[a].c||mTot[b].t-mTot[a].t);
const TOP=MODELS.filter(m=>m!=='unknown').slice(0,5);
const SER=TOP.map((m,i)=>({k:m,label:short(m),c:'var(--s'+(i+1)+')'}));
if(MODELS.some(m=>!TOP.includes(m)))SER.push({k:'other',label:'other models',c:'var(--s0)'});
const serOf=m=>TOP.includes(m)?m:'other';
const minT=Math.min(...SS.map(s=>s._t),...TT.map(t=>t._c).filter(ok),gen);
const D0=Date.parse(day(minT)), DEND=Date.parse(day(gen))+DAY;
const TK=[['input','input'],['cache_write','cache write'],['cache_read','cache read'],['output','output']];
/* ---------- state & filters ---------- */
const st={from:'',to:'',ms:'',q:'',model:'',tk:'all',ts:{k:'id',d:-1},ss:{k:'start',d:-1},tAll:false,sAll:false};
const F={};
function compute(){
 const q=st.q.trim().toLowerCase(), tf=!!(st.ms||q);
 const m0=t=>(!st.ms||(st.ms==='_none'?!t.milestone:t.milestone===st.ms))&&(!q||t.id.toLowerCase().includes(q)||t.title.toLowerCase().includes(q));
 const T0=new Set(TT.filter(m0).map(t=>t.id));
 F.S=SS.filter(s=>(!st.model||s.models[st.model])&&(!tf||s.tasks.some(id=>T0.has(id))));
 F.T=TT.filter(t=>T0.has(t.id)&&(!st.model||(tSess.get(t.id)||[]).some(s=>s.models[st.model])));
 F.Tset=new Set(F.T.map(t=>t.id));
 F.a=st.from?Date.parse(st.from+'T00:00:00Z'):D0;
 F.b=st.to?Date.parse(st.to+'T00:00:00Z')+DAY:DEND;
 if(!(F.b>F.a))F.b=F.a+DAY;
 F.inP=ms=>ms!=null&&ms>=F.a&&ms<F.b;
 F.Sp=F.S.filter(s=>F.inP(s._t));
 F.Tp=F.T.filter(t=>(t._c==null||t._c<F.b)&&((t._u!=null?t._u:t.status==='Done'?t._c:gen)>=F.a));
 F.agg=taskAgg(F.Sp);
}
const sModels=s=>st.model?(s.models[st.model]?{[st.model]:s.models[st.model]}:{}):s.models;
function sCost(s){if(!st.model)return ok(s.cost)?s.cost:null;const m=s.models[st.model];return m&&ok(m.cost)?m.cost:null}
function sTok(s){const r=[0,0,0,0];for(const v of Object.values(sModels(s)))TK.forEach(([k],i)=>r[i]+=v[k]||0);return r}
function taskAgg(Sp){const m=new Map();for(const s of Sp){const k=s.tasks.length;if(!k)continue;const c=sCost(s);for(const id of s.tasks){if(!F.Tset.has(id))continue;const o=m.get(id)||{cost:0,miss:0,turns:0,tools:0,act:0,n:0};o.n++;if(c==null)o.miss++;else o.cost+=c/k;o.turns+=(s.turns||0)/k;o.tools+=(s.tool_calls||0)/k;o.act+=(s.active_min||0)/k;m.set(id,o)}}for(const o of m.values())if(o.miss===o.n)o.cost=null;return m}
function kpi(a,b){
 const s=F.S.filter(x=>x._t>=a&&x._t<b);let cost=0,miss=0,act=0,wall=0;const tk=[0,0,0,0];
 for(const x of s){const c=sCost(x);if(c==null)miss++;else cost+=c;sTok(x).forEach((v,i)=>tk[i]+=v);act+=x.active_min||0;wall+=x.wall_min||0}
 const done=F.T.filter(t=>t.status==='Done'&&t._u!=null&&t._u>=a&&t._u<b);
 return{n:s.length,cost:s.length&&miss<s.length?cost:null,miss,tk,tt:tk.reduce((x,y)=>x+y,0),act:s.length?act/60:null,wall:s.length?wall/60:null,done:done.length,cyc:median(done.map(t=>t.cycle_h).filter(ok)),D:done}
}
/* ---------- generic pieces ---------- */
function ticks(m){if(!(m>0))return[0,1];const r=m/4,p=10**Math.floor(Math.log10(r)),s=[1,2,2.5,5,10].map(x=>x*p).find(x=>x>=r);const a=[];for(let v=0;v<m-1e-9;v+=s)a.push(+v.toPrecision(6));a.push(+(a[a.length-1]+s).toPrecision(6));return a}
function legend(items){return el('ul',{class:'legend'},items.map(i=>el('li',null,el('span',{class:'sw'+(i.ln?' ln':'')+(i.ring?' ring':''),style:i.ring?'color:'+i.c:'background:'+i.c,'aria-hidden':'true'}),i.label)))}
function cw(id){const n=$(id);return n?Math.max(280,n.clientWidth):640}
function buckets(a,b,week){
 const out=[];let t=a;if(week){const d=new Date(t).getUTCDay();t-=((d+6)%7)*DAY}
 for(;t<b;t+=week?7*DAY:DAY)out.push({s:t,e:t+(week?7:1)*DAY,label:(week?'wk ':'')+md(t),full:week?'week of '+day(t):day(t)});
 return out.slice(0,400);
}
const bIdx=(B,ms)=>{for(let i=0;i<B.length;i++)if(ms>=B[i].s&&ms<B[i].e)return i;return -1};
/* bar chart: stacked or grouped series per bucket, optional line (same unit, one y-axis) */
function barChart(o){

add(moS,[el('option',{value:'',text:'All models'}),MODELS.map(m=>el('option',{value:m,text:m}))]);
function sync(){fromI.value=st.from;toI.value=st.to;msS.value=st.ms;qI.value=st.q;moS.value=st.model}
document.querySelectorAll('[data-preset]').forEach(b=>b.addEventListener('click',()=>{const p=b.dataset.preset;if(p==='all'){st.from=st.to=''}else{st.to=day(DEND-DAY);st.from=day(Math.max(D0,DEND-p*DAY))}sync();render()}));
fromI.addEventListener('change',()=>{st.from=fromI.value;render()});toI.addEventListener('change',()=>{st.to=toI.value;render()});
msS.addEventListener('change',()=>{st.ms=msS.value;render()});moS.addEventListener('change',()=>{st.model=moS.value;render()});
let qt;qI.addEventListener('input',()=>{clearTimeout(qt);qt=setTimeout(()=>{st.q=qI.value;render()},250)});
$('reset').addEventListener('click',()=>{st.from=st.to=st.ms=st.q=st.model='';sync();render();$('reset').blur();qI.focus()});
$('ftoggle').addEventListener('click',()=>{const o=$('bar').classList.toggle('open');$('ftoggle').setAttribute('aria-expanded',String(o))});
let rw=innerWidth,rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(Math.abs(innerWidth-rw)>40){rw=innerWidth;render()}},200)});
$('foot').textContent='Generated '+dt(meta.generated)+' UTC from '+int(meta.transcripts)+' transcript file(s); prices as of '+(meta.prices_date||NA)+'. '+(meta.note||'')+' Presets count back from the generation date. Transcripts exist only for recent weeks, so older tasks have no linked sessions.';
sync();render();
})();
</script>
</body>
</html>
